name = "ECSAST"
grammar = "ecsast"
path_suffixes = ["ecs"]
line_comments = ["// "]
autoclose_before = ";:.,=}])>"

[[brackets]]
start = "{"
end = "}"
close = true
newline = true

[[brackets]]
start = "("
end = ")"
close = true
newline = false

[[brackets]]
start = "["
end = "]"
close = true
newline = false

[[brackets]]
start = '"'
end = '"'
close = true
newline = false
not_in = ["string", "comment"]
